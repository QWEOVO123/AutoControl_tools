[project]
name = "my-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "QWEOVO", email = "admin@qweovo.top" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.8.4",
    "langchain-deepseek>=1.2.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.59.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
my-ai-agent = "my_ai_agent.main:main"
my-ai-agent-web = "my_ai_agent.web.cli:serve"
my-ai-agent-user = "my_ai_agent.web.cli:manage_user"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
